<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nortesur · Panel de negocio</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}?v=f10b3">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="topbar"><div class="shell nav">
    <a class="brand" href="/">NORTESUR <span>Panel de negocio</span></a>
    {% set section_url = '' if summary is defined else '/' %}
    <nav aria-label="Principal">
      <a href="{{ section_url }}#resumen">Resumen</a><a href="{{ section_url }}#evolucion">Evolución</a>
      <a href="{{ section_url }}#inventario">Inventario</a><a href="{{ section_url }}#catalogo">Catálogo</a>
    </nav>
  </div></header>
  <main id="contenido" class="shell" tabindex="-1">{% block content %}{% endblock %}</main>
  <footer class="shell">Distribuciones Nortesur · Datos consolidados de catálogo, tarifas, pedidos y stock.</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
